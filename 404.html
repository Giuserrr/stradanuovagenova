<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Pagina non trovata — Strada Nuova</title>
  <style>
    :root { --bg:#1a1a1a; --text:#f0f0f0; --text-dim:#888; --accent:#e8531e; --border:#333; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.5}
    main{max-width:640px;text-align:center}
    h1{font-size:clamp(2rem,6vw,3rem);font-weight:600;margin-bottom:16px;letter-spacing:-.02em}
    p{color:var(--text-dim);margin-bottom:32px;font-size:1.05rem}
    .links{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
    a{color:var(--text);text-decoration:none;border:1px solid var(--border);padding:12px 20px;border-radius:2px;transition:all .2s;font-size:.95rem}
    a:hover{border-color:var(--accent);color:var(--accent)}
    .primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .primary:hover{background:#ff6a35;border-color:#ff6a35;color:#fff}
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>La pagina che cerchi non esiste o è stata spostata.</p>
    <div class="links">
      <a class="primary" href="/">Torna alla home</a>
      <a href="/chi-siamo">Chi siamo</a>
      <a href="/appuntamento">Appuntamento</a>
    </div>
  </main>
</body>
</html>
